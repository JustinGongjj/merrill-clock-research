[tool.pytest.ini_options]
# Monorepo root config. Running `pytest` from the repo root collects all three
# active packages; running it inside a package directory still uses that
# package's own pyproject.toml (unchanged behaviour).
#
# `packages/merrill-clock-lab` is an archived snapshot kept for history only
# (it ships the same `quantclock` package name as merrill-clock-quant and its
# unique modules were already merged into the active package). Its tests are
# deliberately not collected: they duplicate the active package's suites and
# would collide on module names.
testpaths = [
    "packages/merrill-clock-quant/tests",
    "packages/merrill-clock-factor-regression/tests",
    "packages/clockdata/tests",
    "packages/starmap/tests",
]
# Each package ships a top-level `examples_*.py` helper that its own tests
# import by name. Those imports worked when pytest ran from inside the package
# directory (CWD on sys.path); from the monorepo root we add them explicitly.
pythonpath = [
    "packages/merrill-clock-quant",
    "packages/merrill-clock-factor-regression",
    "packages/clockdata",
    "packages/starmap",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
