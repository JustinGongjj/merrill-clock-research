[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starmap"
version = "0.1.0"
description = "Sci-fi constellation visualisation for the Merrill-clock research stack: node graph, density cloud and forward forecast"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
starmap = "starmap.cli:main"

[tool.setuptools.packages.find]
include = ["starmap*"]
