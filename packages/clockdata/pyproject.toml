[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merrill-clock-data"
version = "0.1.0"
description = "Local SQLite financial database and source adapters for Merrill-clock research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "JustinGongjj"}]
license = "MIT"
dependencies = ["numpy>=1.24", "pandas>=2.2", "requests>=2.31", "urllib3>=1.26"]

[project.optional-dependencies]
providers = ["yfinance>=0.2.40", "statsmodels>=0.14"]
test = ["pytest>=7.4"]

[project.scripts]
clock-data = "clockdata.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clockdata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
